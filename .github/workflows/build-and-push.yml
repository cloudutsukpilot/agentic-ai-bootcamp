# Builds the image exactly once per commit on main and pushes it to JFrog
# tagged by git sha. This sha-tagged image is the single artifact that
# release.yml later promotes (re-tags) to a semver release — it is never
# rebuilt, only re-tagged, satisfying "build once, deploy many times".
name: Build and Push (main)

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_NAME: basic-ai-agent

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to JFrog Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.JFROG_DOCKER_REGISTRY }}
          username: ${{ secrets.JFROG_USER }}
          password: ${{ secrets.JFROG_TOKEN }}

      - name: Compute short sha
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push sha-tagged image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.JFROG_DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.sha.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
