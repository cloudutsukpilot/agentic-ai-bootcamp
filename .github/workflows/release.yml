# Fires on an annotated release tag (created by `make tag`). Never rebuilds
# the image: it promotes the already-built sha-tagged image (from
# build-and-push.yml) to the semver tag via `docker buildx imagetools
# create`, which only copies manifests/tags server-side. It then packages
# and pushes the Helm chart from the apps repo to JFrog, and opens a PR
# against the apps repo bumping the dev values to the new version. Merging
# that PR is what ArgoCD picks up for the dev environment; staging/prod
# promotion is a separate, approval-gated workflow (promote.yml).
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

env:
  IMAGE_NAME: basic-ai-agent
  CHART_NAME: basic-ai-agent

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code repo
        uses: actions/checkout@v4

      - name: Derive version and source sha
        id: vars
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SOURCE_SHA="$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to JFrog Docker registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.JFROG_DOCKER_REGISTRY }}
          username: ${{ secrets.JFROG_USER }}
          password: ${{ secrets.JFROG_TOKEN }}

      - name: Promote sha image to release tag (no rebuild)
        run: |
          set -euo pipefail
          SRC="${{ vars.JFROG_DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ steps.vars.outputs.source_sha }}"
          DEST="${{ vars.JFROG_DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
          docker buildx imagetools create -t "$DEST" "$SRC"
          docker buildx imagetools create -t "${{ vars.JFROG_DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest" "$SRC"

      - name: Checkout apps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.APPS_REPO }}
          token: ${{ secrets.APPS_REPO_TOKEN }}
          path: apps-repo

      - uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Bump Chart.yaml, package and push to JFrog Helm repo
        run: |
          set -euo pipefail
          cd apps-repo/charts/${{ env.CHART_NAME }}
          yq -i '.version = "${{ steps.vars.outputs.version }}" | .appVersion = "${{ github.ref_name }}"' Chart.yaml
          helm dependency update .
          helm package . --destination /tmp/chart-out
          helm registry login ${{ vars.JFROG_URL_HOST }} \
            --username ${{ secrets.JFROG_USER }} \
            --password ${{ secrets.JFROG_TOKEN }}
          helm push /tmp/chart-out/${{ env.CHART_NAME }}-${{ steps.vars.outputs.version }}.tgz \
            oci://${{ vars.JFROG_URL_HOST }}/${{ vars.JFROG_HELM_REPO }}

      - name: Bump dev values to new version
        run: |
          set -euo pipefail
          cd apps-repo
          yq -i '.image.tag = "${{ github.ref_name }}"' environments/dev/values.yaml
          yq -i '.chartVersion = "${{ steps.vars.outputs.version }}"' environments/dev/values.yaml

      - name: Open PR on apps repo (dev)
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.APPS_REPO_TOKEN }}
          path: apps-repo
          branch: release/${{ github.ref_name }}-dev
          commit-message: "chore(dev): bump ${{ env.CHART_NAME }} to ${{ github.ref_name }}"
          title: "Release ${{ github.ref_name }} -> dev"
          body: |
            Automated bump from ${{ github.repository }} release workflow.

            * image: `${{ vars.JFROG_DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}`
            * chart version: `${{ steps.vars.outputs.version }}`
            * source commit: ${{ github.repository }}@${{ steps.vars.outputs.source_sha }}

            Merging this syncs `dev` via ArgoCD automatically. Promote to staging/prod
            with `make promote ENV=staging VERSION=${{ steps.vars.outputs.version }}`.
          labels: automated-release
